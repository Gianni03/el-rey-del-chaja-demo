<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV2 — Chajá · Zingarella · Mousse · Selva Negra</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="tv">
<div class="marco">
  <h1 class="shimmer">El Rey del Chajá</h1>
  <div class="cuadrantes" id="cuad"></div>
</div>
<script>
var DEF = {chaja_1kg:28000, zingarella:25000, mousse_1kg:28000, selva_1kg:28000};
var PRECIOS = Object.assign({}, DEF);
try{
  var g = JSON.parse(localStorage.getItem("chaja_prices_v1") || "null");
  if(g && g.precios) PRECIOS = Object.assign({}, DEF, g.precios);
}catch(e){}
function fmt(n){ return "$ " + Number(n).toLocaleString("es-AR"); }
var IMG = "https://framerusercontent.com/images/";
var ITEMS = [
  {n:"Chajá", f:IMG+"7uMI3s2Fv6Yc3pCjnSAVBfxSTsg.png", d:"Chantilly, merengues y duraznos.", k:"chaja_1kg", porc:"1 kg · 8 porciones"},
  {n:"Zingarella", f:IMG+"KxiewTHWitk1WAAQf4fHMrGehJc.png", d:"Flan casero, chantilly y cerezas.", k:"zingarella", porc:"1 kg · 8 porciones"},
  {n:"Mousse", f:IMG+"U2cHvviPQuuBCZkVcxjhVPpHfA.png", d:"Chocolate intenso y dulce de leche.", k:"mousse_1kg", porc:"1 kg · 8 porciones"},
  {n:"Selva Negra", f:IMG+"FVEvjLDZLxkR6zAuge8FhaaTpnw.png", d:"Chocolate y cerezas al maraschino.", k:"selva_1kg", porc:"1 kg · 8 porciones"}
];
var c = document.getElementById("cuad");
ITEMS.forEach(function(i){
  var d = document.createElement("div");
  d.className = "cuad";
  d.innerHTML = '<img src="'+i.f+'" alt="Foto de '+i.n+'" loading="lazy" onerror="this.style.display=\'none\'">' +
    '<h2 class="shimmer">'+i.n+'</h2><div class="desc">'+i.d+'</div>' +
    '<div class="linea shimmer">'+fmt(PRECIOS[i.k])+' · '+i.porc+'</div>';
  c.appendChild(d);
});
</script>
</body>
</html>

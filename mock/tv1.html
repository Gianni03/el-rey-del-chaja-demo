<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV1 — Promo — El Rey del Chajá</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="tv">
<div class="marco promo-marco">
  <p class="marca-tv">El Rey del Chajá</p>
  <p style="letter-spacing:.3em;text-transform:uppercase;color:var(--texto-suave);margin:0">Solo en el local</p>
  <h1 class="shimmer">PROMO</h1>
  <p style="font-size:clamp(1.4rem,3.5vw,2.4rem);margin:0">1 kg de Chajá + 1 Zingarella</p>
  <div class="promo-fotos">
    <img src="https://framerusercontent.com/images/7uMI3s2Fv6Yc3pCjnSAVBfxSTsg.png" alt="Foto de la torta Chajá">
    <img src="https://framerusercontent.com/images/KxiewTHWitk1WAAQf4fHMrGehJc.png" alt="Foto de la torta Zingarella">
  </div>
  <div class="precio-tv shimmer" id="promo-precio">Consultar</div>
  <p style="color:var(--texto-suave)">Válida hoy, hasta agotar stock del día</p>
</div>
<script>
var p = null; // Sin valor cargado en el admin → "Consultar".
try{
  var g = JSON.parse(localStorage.getItem("chaja_prices_v1") || "null");
  if(g && g.precios && g.precios.promo != null && g.precios.promo !== "") p = g.precios.promo;
}catch(e){}
document.getElementById("promo-precio").textContent =
  (p == null || isNaN(Number(p))) ? "Consultar" : "$ " + Number(p).toLocaleString("es-AR");
</script>
</body>
</html>
